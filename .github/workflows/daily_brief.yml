name: Daily Brief

on:
  schedule:
    - cron: '30 11 * * 1-5'   # Morning: 5:30 AM MT during daylight time
    - cron: '30 12 * * 1-5'   # Morning: 5:30 AM MT during standard time
    - cron: '0 22 * * 1-5'    # Close: 4:00 PM MT during daylight time
    - cron: '0 23 * * 1-5'    # Close: 4:00 PM MT during standard time
    - cron: '0 17 * * 6'      # Weekly: Saturday 11:00 AM MT (10:00 AM in winter), after WSO arrives
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition to send'
        type: choice
        options: [morning, close, weekly]
        default: morning

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Run briefing agent
        env:
          EDITION:                ${{ github.event.inputs.edition }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY:           ${{ secrets.NEWS_API_KEY }}
          FINNHUB_API_KEY:        ${{ secrets.FINNHUB_API_KEY }}
          GNEWS_API_KEY:          ${{ secrets.GNEWS_API_KEY }}
          FRED_API_KEY:           ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY:            ${{ secrets.FMP_API_KEY }}
          ALPHA_VANTAGE_API_KEY:  ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          BLS_API_KEY:            ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY:            ${{ secrets.BEA_API_KEY }}
          DATA_GOV_API_KEY:       ${{ secrets.DATA_GOV_API_KEY }}
          EIA_API_KEY:            ${{ secrets.EIA_API_KEY }}
          GMAIL_USER:             ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:         ${{ secrets.GMAIL_APP_PASS }}
        run: python briefing.py

      - name: Commit state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Daily Brief Bot"
          git add brief_state.json
          git diff --staged --quiet || git commit -m "Update brief state [skip ci]"
          git pull --rebase
          git push
